<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/styles.css">
</head>
<body>
    <div class="h-screen flex justify-center p-20">
        <div class=" w-96 bg-gray-800 border-2 rounded-md">
            <div class="h-1/6 p-5 font-bold">
                <input class="bg-white h-full w-full rounded-md focus:ring-2 outline-none p-5 text-2xl text-center">
            </div>
            <div id="calculator-buttons" class="grid grid-cols-[repeat(4,4rem)] justify-center gap-4 p-5">
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="1"><-</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="2">AC</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="3">%</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="4">÷</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="5">7</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="6">8</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="7">9</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="8">X</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="9">4</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="10">5</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="11">6</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="12">-</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="13">1</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="14">2</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="15">3</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="16">+</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="17">±</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="18">0</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="19">.</button>
                <button class="h-16 w-full rounded-md bg-gray-200 text-xl font-bold text-gray-900 hover:bg-gray-300 active:bg-gray-400" type="button" data-button-number="20">=</button>
            </div>
        </div>
    </div>
</body>
</html>
